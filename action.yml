name: GHOSTDIFF behavior check
description: Compare two already-running disposable local web applications.
inputs:
  before:
    description: Baseline loopback URL
    required: true
  after:
    description: Candidate loopback URL
    required: true
  depth:
    description: Maximum action depth
    default: '2'
  budget:
    description: Maximum explored paths
    default: '30'
  upload-report:
    description: Upload reports containing observed application data (synthetic data only)
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - shell: bash
      run: |
        python -m pip install "$GITHUB_ACTION_PATH"
        python -m playwright install --with-deps chromium
    - id: compare
      shell: bash
      env:
        BEFORE: ${{ inputs.before }}
        AFTER: ${{ inputs.after }}
        DEPTH: ${{ inputs.depth }}
        BUDGET: ${{ inputs.budget }}
      run: |
        set +e
        ghostdiff compare --before "$BEFORE" --after "$AFTER" --depth "$DEPTH" --budget "$BUDGET" --allow-actions --fail-on-change --out "$RUNNER_TEMP/ghostdiff-evidence"
        status=$?
        set -e
        python "$GITHUB_ACTION_PATH/scripts/ci_summary.py" "$RUNNER_TEMP/ghostdiff-evidence/evidence.json" >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
    - if: always() && inputs.upload-report == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ghostdiff-evidence
        path: ${{ runner.temp }}/ghostdiff-evidence/
        if-no-files-found: ignore
