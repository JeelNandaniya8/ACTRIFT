name: Publish verified preview
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact verified main commit SHA (40 lowercase hex characters)
        required: true
        type: string
      test-run:
        description: Successful Tests workflow run ID for the exact commit
        required: true
        type: string
      security-run:
        description: Successful Automated security checks workflow run ID for the exact commit
        required: true
        type: string
      review-confirmed:
        description: Maintainer has reviewed security findings and release limitations
        required: true
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: inputs.review-confirmed && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact successful workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
          TEST_RUN: ${{ inputs.test-run }}
          SECURITY_RUN: ${{ inputs.security-run }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TEST_RUN" =~ ^[0-9]+$ ]]
          [[ "$SECURITY_RUN" =~ ^[0-9]+$ ]]
          test "$COMMIT" = "$GITHUB_SHA"
          verify_run() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1" | jq -e --arg sha "$COMMIT" --arg path "$2" '.head_sha == $sha and .head_branch == "main" and .path == $path and .event == "push" and .conclusion == "success"' >/dev/null
          }
          verify_run "$TEST_RUN" ".github/workflows/test.yml"
          verify_run "$SECURITY_RUN" ".github/workflows/security.yml"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ghostdiff-preview-distribution
          path: dist/
          run-id: ${{ inputs.test-run }}
          github-token: ${{ github.token }}
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "docs/release-$version.md"
          test "$(find dist -maxdepth 1 -name "*-$version-*.whl" | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name "*-$version.tar.gz" | wc -l)" = 1
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite."
            exit 1
          fi
          gh release create "v$version" --target "$COMMIT" --prerelease --title "GHOSTDIFF v$version preview" --notes-file "docs/release-$version.md" dist/* 
