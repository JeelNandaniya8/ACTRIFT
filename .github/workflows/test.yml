name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
        env:
          GHOSTDIFF_BROWSER_TESTS: '1'
      - run: python benchmarks/run.py --out benchmark.json
      - run: ghostdiff demo --out demo-report
      - run: ghostdiff freeze demo-report/evidence.json --out contracts.json --test-out test_protected.py
      - run: python -m compileall -q test_protected.py
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-python-${{ matrix.python }}
          path: |
            benchmark.json
            demo-report/
            contracts.json
            test_protected.py
