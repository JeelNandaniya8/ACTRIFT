name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
        env:
          GHOSTDIFF_BROWSER_TESTS: '1'
      - run: python benchmarks/run.py --out benchmark.json
      - run: python benchmarks/upstream.py --out upstream-benchmark.json
      - run: python benchmarks/historical.py --out historical-benchmark.json
      - run: python benchmarks/channel_history.py --out channel-history.json
      - run: python benchmarks/todomvc_history.py --out todomvc-history.json
      - run: python benchmarks/htmx_history.py --out htmx-history.json
      - run: python benchmarks/htmx_ajax_history.py --out htmx-ajax-history.json
      - run: python benchmarks/ghostbench.py --suite core --out ghostbench-core.json
      - run: ghostdiff demo --out demo-report
      - run: ghostdiff freeze demo-report/evidence.json --out contracts.json --test-out test_protected.py
      - run: python -m compileall -q test_protected.py
      - run: python -m pip check
      - run: python scripts/ci_summary.py demo-report/evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-python-${{ matrix.python }}
          path: |
            benchmark.json
            upstream-benchmark.json
            historical-benchmark.json
            channel-history.json
            todomvc-history.json
            htmx-history.json
            htmx-ajax-history.json
            ghostbench-core.json
            demo-report/
            contracts.json
            test_protected.py

  cross-browser:
    strategy:
      fail-fast: false
      matrix:
        browser: ['firefox', 'webkit']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: ghostdiff doctor --browser ${{ matrix.browser }}
      - run: python -m unittest discover -s tests -p test_cross_browser.py -v
        env:
          GHOSTDIFF_CROSS_BROWSER: ${{ matrix.browser }}
  isolated-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f sandbox/Dockerfile -t ghostdiff-preview .
      - name: Historical benchmark in a network-disabled container
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m --tmpfs /home/ghostdiff:rw,nosuid,nodev,uid=10001,gid=10001,size=64m --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 1g --cpus 2 --shm-size 256m --entrypoint python ghostdiff-preview /app/benchmarks/historical.py --out /tmp/historical.json
  action-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: fixture
        shell: bash
        run: |
          python -m scripts.serve_demo "$RUNNER_TEMP/fixture.json" >"$RUNNER_TEMP/fixture.log" 2>&1 &
          for i in $(seq 1 50); do
            if [ -s "$RUNNER_TEMP/fixture.json" ]; then break; fi
            sleep 0.1
          done
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); print("\n".join(k+"="+v for k,v in d.items()))' "$RUNNER_TEMP/fixture.json" >> "$GITHUB_OUTPUT"
      - uses: ./
        id: clean
        with:
          before: ${{ steps.fixture.outputs.before }}
          after: ${{ steps.fixture.outputs.clean }}
          depth: '1'
          budget: '8'
      - uses: ./
        id: broken
        continue-on-error: true
        with:
          before: ${{ steps.fixture.outputs.before }}
          after: ${{ steps.fixture.outputs.broken }}
          depth: '1'
          budget: '8'
      - shell: bash
        env:
          CLEAN: ${{ steps.clean.outcome }}
          BROKEN: ${{ steps.broken.outcome }}
          SUMMARY: ${{ steps.broken.outputs.summary }}
        run: |
          test "$CLEAN" = success
          test "$BROKEN" = failure
          echo "$SUMMARY" | grep -q 'download_changed: 1'
          echo "$SUMMARY" | grep -q 'unmatched: 1'
  scalability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m playwright install --with-deps chromium
      - run: python benchmarks/scale.py --out scale.json
      - run: python benchmarks/todomvc_scale.py --out todomvc-scale.json
      - run: python benchmarks/ghostbench.py --suite scale --out ghostbench-scale.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalability-measurements
          path: |
            scale.json
            todomvc-scale.json
            ghostbench-scale.json
  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m playwright install chromium
      - run: ghostdiff doctor
      - run: python -m unittest discover -s tests -p test_cross_browser.py -v
        env:
          GHOSTDIFF_CROSS_BROWSER: chromium
  mcp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[mcp]'
      - run: python tests/mcp_smoke.py
  package-preview:
    needs: [test, cross-browser, isolated-demo, action-smoke, scalability, platform-smoke, mcp-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
      - run: (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - run: |
          python -m venv /tmp/ghostdiff-wheel-check
          /tmp/ghostdiff-wheel-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/ghostdiff-wheel-check/bin/ghostdiff --help
      - uses: actions/upload-artifact@v4
        with:
          name: ghostdiff-preview-distribution
          path: dist/
