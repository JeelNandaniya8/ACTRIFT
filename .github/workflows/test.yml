name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
        env:
          GHOSTDIFF_BROWSER_TESTS: '1'
      - run: python benchmarks/run.py --out benchmark.json
      - run: python benchmarks/upstream.py --out upstream-benchmark.json
      - run: ghostdiff demo --out demo-report
      - run: ghostdiff freeze demo-report/evidence.json --out contracts.json --test-out test_protected.py
      - run: python -m compileall -q test_protected.py
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-python-${{ matrix.python }}
          path: |
            benchmark.json
            upstream-benchmark.json
            demo-report/
            contracts.json
            test_protected.py

  cross-browser:
    strategy:
      fail-fast: false
      matrix:
        browser: ['firefox', 'webkit']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: ghostdiff doctor --browser ${{ matrix.browser }}
      - run: python -m unittest discover -s tests -p test_cross_browser.py -v
        env:
          GHOSTDIFF_CROSS_BROWSER: ${{ matrix.browser }}
  release-preview:
    needs: [test, cross-browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ghostdiff-preview-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
      - run: |
          python -m venv /tmp/ghostdiff-wheel-check
          /tmp/ghostdiff-wheel-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/ghostdiff-wheel-check/bin/ghostdiff --help
      - run: |
          if gh release view v0.3.0 >/dev/null 2>&1; then
            echo "Preview already published"
          else
            gh release create v0.3.0 --target "$GITHUB_SHA" --prerelease --title "GHOSTDIFF v0.3.0 — Research preview" --notes-file docs/release-0.3.0.md dist/*
          fi
        env:
          GH_TOKEN: ${{ github.token }}
