name: Bug report
description: Report a reproducible issue
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include versions, command and disposable fixture.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed results
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Evidence contains no credentials or private user data.
          required: true
