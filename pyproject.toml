[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ghostdiff-lab"
version = "0.7.0"
description = "Compare observable browser behavior."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["playwright>=1.48,<2"]
license = {text = "Apache-2.0"}
[project.optional-dependencies]
mcp = ["mcp>=1.12,<2; python_version >= '3.11'"]
[project.scripts]
ghostdiff = "ghostdiff.cli:main"
ghostdiff-mcp = "ghostdiff.mcp_server:main"
[tool.setuptools.packages.find]
include = ["ghostdiff*"]
